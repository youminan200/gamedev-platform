<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="canonical" href="https://gamedev-platform-expo-client.vercel.app/pixel-studio.html" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEVGROUND // PIXEL_SPRITE & ANIMATION SHEET WORKSHOP</title>
  <style>
    @font-face {
      font-family: 'DungGeunMo';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
    }
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      padding: 12px;
      background: #11131C;
      color: #F3F4F6;
      font-family: 'DungGeunMo', 'Courier New', monospace;
    }
    .workshop-wrap {
      max-width: 750px;
      margin: 0 auto;
      background: #1A1D2B;
      border: 2px solid #3A415E;
      border-radius: 6px;
      padding: 14px;
      box-shadow: 4px 4px 0px #07080D;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 2px solid #3A415E;
      margin-bottom: 10px;
    }
    .title {
      font-size: 16px;
      font-weight: 900;
      color: #FFD166;
    }
    .badge {
      font-size: 11px;
      background: #FF4D6D;
      color: #FFF;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    button {
      font-family: 'DungGeunMo', monospace;
      font-size: 11.5px;
      background: #252A3E;
      color: #F3F4F6;
      border: 1.5px solid #3A415E;
      border-radius: 4px;
      padding: 6px 9px;
      cursor: pointer;
    }
    button:hover { border-color: #FFD166; }
    button.active {
      background: #FF4D6D;
      color: #FFF;
      border-color: #FF4D6D;
    }
    button.cyan {
      background: #00E5FF;
      color: #11131C;
      border-color: #00E5FF;
      font-weight: 900;
    }
    button.gold {
      background: #FFD166;
      color: #11131C;
      border-color: #FFD166;
      font-weight: 900;
    }
    button.emerald {
      background: #10B981;
      color: #11131C;
      border-color: #10B981;
      font-weight: 900;
    }
    .frame-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      background: #11131C;
      border: 1.5px solid #3A415E;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 12px;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 225px;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 620px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    .canvas-box {
      position: relative;
      width: 100%;
      max-width: 384px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border: 2px solid #FFD166;
      background-image:
        linear-gradient(45deg, #181B28 25%, transparent 25%),
        linear-gradient(-45deg, #181B28 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #181B28 75%),
        linear-gradient(-45deg, transparent 75%, #181B28 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-color: #232738;
      touch-action: none;
    }
    canvas#editor {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: crosshair;
      display: block;
    }
    .side-panel {
      background: #11131C;
      border: 1.5px solid #3A415E;
      border-radius: 6px;
      padding: 10px;
    }
    .section-label {
      font-size: 11px;
      color: #9CA3AF;
      margin-bottom: 6px;
      display: block;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 10px;
    }
    .swatch {
      height: 24px;
      border-radius: 4px;
      border: 2px solid #3A415E;
      cursor: pointer;
    }
    .swatch.selected {
      border-color: #FFFFFF;
      transform: scale(1.08);
    }
    .preview-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1A1D2B;
      border: 1.5px solid #3A415E;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    #animCanvas {
      width: 56px;
      height: 56px;
      image-rendering: pixelated;
      border: 1.5px solid #00E5FF;
      background: #11131C;
    }
    .status-msg {
      margin-top: 8px;
      font-size: 11.5px;
      color: #10B981;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="workshop-wrap">
    <div class="top-bar">
      <span class="title">🎨 PIXEL_SPRITE & 4-FRAME ANIMATOR // 도트·스프라이트 시트 공방</span>
      <span class="badge">UNITY SPRITE SHEET READY</span>
    </div>

    <!-- Tools Row -->
    <div class="toolbar">
      <button id="toolPen" class="active" onclick="setTool('pen')">✏️ 펜(Pen)</button>
      <button id="toolBucket" onclick="setTool('bucket')">🪣 채우기(Fill)</button>
      <button id="toolEraser" onclick="setTool('eraser')">🧽 지우개</button>
      <button id="btnMirror" onclick="toggleMirror()">🦋 좌우대칭: OFF</button>
      <button id="btnOnion" class="active" onclick="toggleOnion()">🧅 어니언스킨: ON</button>
      <button id="btnGrid" class="active" onclick="toggleGrid()"># 격자: ON</button>
      <button onclick="setGridSize(16)" id="size16" class="active">16×16</button>
      <button onclick="setGridSize(32)" id="size32">32×32</button>
      <button onclick="clearCanvas()">🗑️ 현재프레임 지우기</button>
    </div>

    <!-- 4-Frame Animation Timeline Bar -->
    <div class="frame-bar">
      <span style="font-size:11px; color:#00E5FF; font-weight:900;">🎞️ 애니 프레임:</span>
      <button id="frameBtn0" class="active" onclick="selectFrame(0)">[F1]</button>
      <button id="frameBtn1" onclick="selectFrame(1)">[F2]</button>
      <button id="frameBtn2" onclick="selectFrame(2)">[F3]</button>
      <button id="frameBtn3" onclick="selectFrame(3)">[F4]</button>
      <button onclick="duplicatePrevFrame()">📋 이전 프레임 복제</button>
      <span style="font-size:11px; color:#FFD166; margin-left:auto;">[움직이는 프리셋]:</span>
      <button onclick="loadTemplate('slime')">💧 점프 슬라임</button>
      <button onclick="loadTemplate('sword')">⚔️ 검기 베기</button>
      <button onclick="loadTemplate('robot')">🤖 깜빡 메카봇</button>
    </div>

    <div class="main-grid">
      <div class="canvas-box">
        <canvas id="editor" width="384" height="384"></canvas>
      </div>

      <div class="side-panel">
        <span class="section-label">> LIVE 4-FRAME ANIMATION PREVIEW</span>
        <div class="preview-box">
          <canvas id="animCanvas" width="32" height="32"></canvas>
          <div style="flex:1;">
            <div style="font-size:11px; color:#00E5FF; font-weight:900; margin-bottom:4px;">
              FPS: <span id="fpsLabel">6</span> (실시간 재생)
            </div>
            <input type="range" min="2" max="14" value="6" style="width:100%;" oninput="updateFps(this.value)" />
          </div>
        </div>

        <span class="section-label">> PICO-8 & INDIE PALETTE</span>
        <div class="palette-grid" id="paletteGrid"></div>

        <span class="section-label">> CUSTOM COLOR</span>
        <input type="color" id="customColor" value="#FF4D6D" style="width:100%; height:28px; border:none; background:none; cursor:pointer; margin-bottom:10px;" onchange="selectColor(this.value)" />

        <div style="display:flex; flex-direction:column; gap:6px;">
          <button class="emerald" onclick="downloadSpriteSheetPNG()">🎞️ 4프레임 스프라이트 시트(.PNG)</button>
          <button class="gold" onclick="downloadPNG()">💾 현재 프레임 단일(.PNG) 저장</button>
          <button class="cyan" onclick="sendToParent()">🚀 개발일지/에셋 창고로 즉시 전송</button>
        </div>
        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>
  </div>

  <script>
    const PALETTE = [
      '#FF4D6D', '#FFD166', '#06D6A0', '#00E5FF',
      '#118AB2', '#A855F7', '#F97316', '#EF4444',
      '#FFFFFF', '#CBD5E1', '#64748B', '#1E293B',
      '#000000', '#7F5539', '#B08968', '#FDE047'
    ];

    let gridSize = 16;
    const TOTAL_FRAMES = 4;
    let frames = [];
    let currentFrame = 0;
    let currentColor = '#FF4D6D';
    let currentTool = 'pen';
    let mirrorX = false;
    let onionSkin = true;
    let showGrid = true;
    let isDrawing = false;
    let animFps = 6;
    let previewFrameIdx = 0;
    let animInterval = null;

    const canvas = document.getElementById('editor');
    const ctx = canvas.getContext('2d');
    const animCanvas = document.getElementById('animCanvas');
    const aCtx = animCanvas.getContext('2d');

    function createEmptyGrid(size) {
      return Array.from({ length: size }, () => Array(size).fill(null));
    }

    function initAllFrames(size) {
      frames = Array.from({ length: TOTAL_FRAMES }, () => createEmptyGrid(size));
      currentFrame = 0;
      updateFrameButtons();
    }

    function updateFrameButtons() {
      for (let i = 0; i < TOTAL_FRAMES; i++) {
        document.getElementById('frameBtn' + i).classList.toggle('active', i === currentFrame);
      }
    }

    function selectFrame(idx) {
      currentFrame = idx;
      updateFrameButtons();
      render();
    }

    function duplicatePrevFrame() {
      const prevIdx = (currentFrame + TOTAL_FRAMES - 1) % TOTAL_FRAMES;
      frames[currentFrame] = frames[prevIdx].map(row => [...row]);
      render();
      setStatus('📋 이전 프레임을 현재 프레임으로 복제했습니다! 조금만 수정해 움직임을 만들어보세요.');
    }

    function toggleOnion() {
      onionSkin = !onionSkin;
      const btn = document.getElementById('btnOnion');
      btn.textContent = '🧅 어니언스킨: ' + (onionSkin ? 'ON' : 'OFF');
      btn.classList.toggle('active', onionSkin);
      render();
    }

    function buildPalette() {
      const wrap = document.getElementById('paletteGrid');
      wrap.innerHTML = '';
      PALETTE.forEach(c => {
        const d = document.createElement('div');
        d.className = 'swatch' + (c === currentColor ? ' selected' : '');
        d.style.backgroundColor = c;
        d.onclick = () => selectColor(c);
        wrap.appendChild(d);
      });
    }

    function selectColor(c) {
      currentColor = c;
      document.getElementById('customColor').value = c;
      if (currentTool === 'eraser') setTool('pen');
      buildPalette();
    }

    function setTool(t) {
      currentTool = t;
      document.getElementById('toolPen').classList.toggle('active', t === 'pen');
      document.getElementById('toolBucket').classList.toggle('active', t === 'bucket');
      document.getElementById('toolEraser').classList.toggle('active', t === 'eraser');
    }

    function toggleMirror() {
      mirrorX = !mirrorX;
      const btn = document.getElementById('btnMirror');
      btn.textContent = '🦋 좌우대칭: ' + (mirrorX ? 'ON' : 'OFF');
      btn.classList.toggle('active', mirrorX);
    }

    function toggleGrid() {
      showGrid = !showGrid;
      const btn = document.getElementById('btnGrid');
      btn.textContent = '# 격자: ' + (showGrid ? 'ON' : 'OFF');
      btn.classList.toggle('active', showGrid);
      render();
    }

    function setGridSize(size) {
      gridSize = size;
      document.getElementById('size16').classList.toggle('active', size === 16);
      document.getElementById('size32').classList.toggle('active', size === 32);
      initAllFrames(size);
      render();
    }

    function clearCanvas() {
      frames[currentFrame] = createEmptyGrid(gridSize);
      render();
      setStatus('현재 프레임 캔버스를 초기화했습니다.');
    }

    function floodFill(grid, x, y, targetColor, replacementColor) {
      if (targetColor === replacementColor) return;
      const stack = [[x, y]];
      while (stack.length > 0) {
        const [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= gridSize || cy >= gridSize) continue;
        if (grid[cy][cx] !== targetColor) continue;
        grid[cy][cx] = replacementColor;
        stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
      }
    }

    function applyAt(x, y) {
      if (x < 0 || y < 0 || x >= gridSize || y >= gridSize) return;
      const grid = frames[currentFrame];
      if (currentTool === 'bucket') {
        floodFill(grid, x, y, grid[y][x], currentColor);
      } else {
        const val = currentTool === 'eraser' ? null : currentColor;
        grid[y][x] = val;
        if (mirrorX) {
          grid[y][gridSize - 1 - x] = val;
        }
      }
      render();
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = Math.floor(((clientX - rect.left) / rect.width) * gridSize);
      const y = Math.floor(((clientY - rect.top) / rect.height) * gridSize);
      return [x, y];
    }

    canvas.addEventListener('pointerdown', (e) => {
      isDrawing = true;
      const [x, y] = getCoords(e);
      applyAt(x, y);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing || currentTool === 'bucket') return;
      const [x, y] = getCoords(e);
      applyAt(x, y);
    });
    window.addEventListener('pointerup', () => { isDrawing = false; });

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cell = canvas.width / gridSize;

      // Onion skin of previous frame
      if (onionSkin && currentFrame > 0) {
        const prevGrid = frames[currentFrame - 1];
        ctx.save();
        ctx.globalAlpha = 0.25;
        for (let y = 0; y < gridSize; y++) {
          for (let x = 0; x < gridSize; x++) {
            if (prevGrid[y][x]) {
              ctx.fillStyle = prevGrid[y][x];
              ctx.fillRect(x * cell, y * cell, Math.ceil(cell), Math.ceil(cell));
            }
          }
        }
        ctx.restore();
      }

      const grid = frames[currentFrame];
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (grid[y][x]) {
            ctx.fillStyle = grid[y][x];
            ctx.fillRect(x * cell, y * cell, Math.ceil(cell), Math.ceil(cell));
          }
        }
      }

      if (showGrid) {
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= gridSize; i++) {
          ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
        }
      }
    }

    function renderAnimTick() {
      animCanvas.width = gridSize;
      animCanvas.height = gridSize;
      aCtx.clearRect(0, 0, gridSize, gridSize);
      const g = frames[previewFrameIdx] || frames[0];
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (g[y][x]) {
            aCtx.fillStyle = g[y][x];
            aCtx.fillRect(x, y, 1, 1);
          }
        }
      }
      previewFrameIdx = (previewFrameIdx + 1) % TOTAL_FRAMES;
    }

    function updateFps(val) {
      animFps = Number(val);
      document.getElementById('fpsLabel').textContent = val;
      if (animInterval) clearInterval(animInterval);
      animInterval = setInterval(renderAnimTick, 1000 / animFps);
    }

    function getExportDataUrl(scale = 16) {
      const out = document.createElement('canvas');
      out.width = gridSize * scale;
      out.height = gridSize * scale;
      const octx = out.getContext('2d');
      octx.imageSmoothingEnabled = false;
      const grid = frames[currentFrame];
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (grid[y][x]) {
            octx.fillStyle = grid[y][x];
            octx.fillRect(x * scale, y * scale, scale, scale);
          }
        }
      }
      return out.toDataURL('image/png');
    }

    function getSpriteSheetDataUrl(scale = 8) {
      const out = document.createElement('canvas');
      out.width = gridSize * scale * TOTAL_FRAMES;
      out.height = gridSize * scale;
      const octx = out.getContext('2d');
      octx.imageSmoothingEnabled = false;
      for (let f = 0; f < TOTAL_FRAMES; f++) {
        const g = frames[f];
        const xOff = f * gridSize * scale;
        for (let y = 0; y < gridSize; y++) {
          for (let x = 0; x < gridSize; x++) {
            if (g[y][x]) {
              octx.fillStyle = g[y][x];
              octx.fillRect(xOff + x * scale, y * scale, scale, scale);
            }
          }
        }
      }
      return out.toDataURL('image/png');
    }

    function downloadPNG() {
      const url = getExportDataUrl(16);
      const a = document.createElement('a');
      a.href = url;
      a.download = `devground-sprite-f${currentFrame + 1}-${gridSize}x${gridSize}.png`;
      a.click();
      setStatus('✅ 현재 프레임 투명 배경 .PNG가 다운로드되었습니다!');
    }

    function downloadSpriteSheetPNG() {
      const url = getSpriteSheetDataUrl(8);
      const a = document.createElement('a');
      a.href = url;
      a.download = `devground-spritesheet-4frames-${gridSize}x${gridSize}.png`;
      a.click();
      setStatus('🎞️ Unity/Godot용 4프레임 가로 스프라이트 시트(.PNG)가 다운로드되었습니다!');
    }

    function sendToParent() {
      const url = getSpriteSheetDataUrl(8);
      if (window.parent) {
        window.parent.postMessage({ type: 'PIXEL_ART_EXPORT', dataUrl: url }, '*');
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
      }
      setStatus('🚀 4프레임 스프라이트 시트가 게시글/에셋 창고로 전송되었습니다!');
    }

    function setStatus(msg) {
      document.getElementById('statusMsg').textContent = msg;
    }

    function loadTemplate(name) {
      setGridSize(16);
      for (let f = 0; f < TOTAL_FRAMES; f++) {
        const g = frames[f];
        const put = (coords, color) => coords.forEach(([x, y]) => {
          if (x >= 0 && x < 16 && y >= 0 && y < 16) g[y][x] = color;
        });
        if (name === 'slime') {
          const yShift = (f === 1 || f === 2) ? -2 : 0;
          for (let y = 6 + yShift; y <= 13 + yShift; y++) {
            for (let x = 3; x <= 12; x++) {
              if ((y === 6 + yShift || y === 13 + yShift) && (x < 5 || x > 10)) continue;
              if (y >= 0 && y < 16) g[y][x] = '#00E5FF';
            }
          }
          put([[5, 6 + yShift],[6, 5 + yShift],[7, 4 + yShift],[8, 4 + yShift],[9, 5 + yShift],[10, 6 + yShift]], '#00E5FF');
          put([[5, 8 + yShift],[6, 8 + yShift],[5, 7 + yShift]], '#FFFFFF');
          put([[6, 10 + yShift],[6, 11 + yShift],[9, 10 + yShift],[9, 11 + yShift]], '#11131C');
        } else if (name === 'sword') {
          for (let i = 0; i < 9; i++) {
            put([[12 - i, 3 + i]], '#FFFFFF');
            put([[11 - i, 3 + i], [12 - i, 4 + i]], '#CBD5E1');
          }
          put([[4,10],[5,10],[6,11],[6,12],[3,9]], '#FFD166');
          put([[3,12],[2,13]], '#7F5539');
          put([[1,14]], '#FF4D6D');
          if (f === 1 || f === 2) {
            put([[13,2],[14,3],[14,4],[13,5],[12,6]], f === 1 ? '#00E5FF' : '#FFD166');
          }
        } else if (name === 'robot') {
          for (let y = 3; y <= 12; y++) {
            for (let x = 4; x <= 11; x++) g[y][x] = '#64748B';
          }
          put([[7,1],[8,1],[7,2],[8,2]], f % 2 === 0 ? '#FFD166' : '#FF4D6D');
          put([[5,5],[6,5],[9,5],[10,5]], f === 2 ? '#FF4D6D' : '#00E5FF');
          put([[6,9],[7,9],[8,9],[9,9]], '#10B981');
          put([[5,13],[6,13],[9,13],[10,13]], '#1E293B');
        }
      }
      render();
      setStatus('✨ 4프레임 움직이는 도트 프리셋이 로드되었습니다! 우측 상단 애니메이션을 확인해보세요.');
    }

    initAllFrames(16);
    buildPalette();
    loadTemplate('slime');
    updateFps(6);
  </script>
</body>
</html>
